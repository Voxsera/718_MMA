# Render Blueprint for 718 MMA Gym (site + API + admin).
# Database is hosted on Supabase (Postgres), so NO persistent disk is needed and
# data survives restarts even on the FREE plan.
services:
  - type: web
    name: 718-mma-gym
    runtime: node
    plan: free                                    # no card required
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        sync: false          # paste your Supabase connection string in the dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # --- Admin portals: Google sign-in allow-list (recommended) ---
      - key: ADMIN_OWNER_EMAILS
        sync: false
      - key: ADMIN_RECEPTION_EMAILS
        sync: false
      - key: ADMIN_COACH_EMAILS
        sync: false
      - key: ADMIN_PASSWORD_LOGIN
        value: "false"
      # Fallback password logins (used only if ADMIN_PASSWORD_LOGIN=true):
      - key: RECEPTION_USERNAME
        value: reception
      - key: RECEPTION_PASSWORD
        sync: false
      - key: COACH_USERNAME
        value: coach
      - key: COACH_PASSWORD
        sync: false
      # --- Google / Razorpay / Supabase ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      # --- Email (invoices + renewal reminders) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # --- URLs (set to your Render URL after the first deploy) ---
      - key: SITE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
