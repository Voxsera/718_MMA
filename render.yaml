# Render Blueprint for 718 MMA Gym (one service: site + API + admin + SQLite)
# Deploy: push to GitHub, then Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: 718-mma-gym
    runtime: node
    plan: starter            # "starter" (paid) is needed for the persistent disk below.
    buildCommand: npm install && npm run build   # installs API deps + builds the React client
    startCommand: npm start                       # node --experimental-sqlite server.js
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_PATH
        value: /data/data.db          # store SQLite on the persistent disk
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                   # set in the Render dashboard (don't commit secrets)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data                # persists data.db across deploys & restarts
      sizeGB: 1
